<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secuelas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <!-- 1. PLAY -->
    <button id="playButton">▶️</button>
    <audio id="alertAudio" src="Alerta.mp3"></audio>

    <!-- 2. ¡BASTA! -->
    <button id="bastaButton">¡BASTA!</button>

    <!-- 3. Cámara -->
    <div id="cameraSection">
      <video id="camera" autoplay playsinline></video>
      <div id="controls">
        <button id="flipButton">🔄</button>
        <button id="captureButton">📸</button>
      </div>
    </div>

    <!-- 4. Foto tipo Polaroid -->
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="photoReveal"></div>

    <!-- 5+6. Mensaje y Versículo -->
    <div id="message"></div>

    <!-- 7. Respiración -->
    <div id="breathing">
      <div class="circle"></div>
      <p>Solo respira…</p>
    </div>

    <!-- 8. Pantalla final -->
    <div id="finalScreen">
      <h1>Secuelas: una lucha constante con nuestra propia mente</h1>
      <p>Regresa cuando lo necesites</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
